<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<base target="_top">
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<style>
  :root{
    --purple:#501e8c; --purple-dark:#3a1464; --purple-light:#f0ebf8;
    --blue:#0a6eaa; --blue-light:#e6f3fa; --bg:#f7f5fb; --ink:#241436; --muted:#6b5a80;
    --border:rgba(80,30,140,.12); --radius:4px; --ok:#1b7a43;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:Cairo,Tahoma,Arial,sans-serif;font-size:15px}
  .en{direction:ltr;unicode-bidi:isolate;display:inline-block}
  .wrap{max-width:1200px;margin:0 auto;padding:0 16px}

  /* Official header band */
  .band{background:#fff;border-bottom:1px solid var(--border)}
  .band .wrap{display:flex;align-items:center;justify-content:space-between;height:84px;gap:12px}
  .band img{max-height:58px;max-width:42vw;object-fit:contain}
  .topbar{background:var(--purple-dark);color:#fff}
  .topbar .wrap{display:flex;align-items:center;justify-content:space-between;min-height:56px;gap:12px;flex-wrap:wrap}
  .topbar h1{margin:0;font-size:20px;font-weight:800;display:flex;align-items:center;gap:8px}
  .topbar .sub{font-size:13px;opacity:.85}
  .ver{background:rgba(255,255,255,.15);border-radius:var(--radius);padding:2px 8px;font-size:12px}
  .diag{height:4px;background:linear-gradient(90deg,var(--blue) 0 35%,var(--purple) 35% 100%)}

  /* Search panel */
  .panel{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin:20px 0 14px;
         display:grid;grid-template-columns:1fr 240px auto;gap:10px;align-items:center}
  .search{position:relative}
  .search input{width:100%;height:46px;border:1px solid var(--border);border-radius:var(--radius);padding:0 44px 0 40px;
                font:inherit;font-size:16px;background:var(--bg)}
  .search input:focus,select:focus{outline:2px solid var(--purple);background:#fff}
  .search .i{position:absolute;right:12px;top:12px;color:var(--muted)}
  .search .clr{position:absolute;left:8px;top:8px;border:0;background:none;cursor:pointer;color:var(--muted);padding:6px;display:none}
  select{height:46px;border:1px solid var(--border);border-radius:var(--radius);padding:0 10px;font:inherit;background:var(--bg)}
  .btn{height:40px;border-radius:var(--radius);padding:0 14px;font:inherit;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
  .btn-p{background:var(--purple);color:#fff;border:0}
  .btn-s{background:#fff;color:var(--purple);border:1px solid var(--purple)}
  .btn svg{width:16px;height:16px}

  .meta{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;color:var(--muted);font-size:13px;margin-bottom:10px}
  .meta b{color:var(--purple)}
  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .chip{background:var(--purple-light);color:var(--purple);border-radius:999px;padding:2px 10px;font-size:12px;font-weight:600}
  .views{display:flex;gap:4px}
  .views button{border:1px solid var(--border);background:#fff;border-radius:var(--radius);height:34px;padding:0 10px;cursor:pointer;color:var(--muted);font:inherit;font-size:13px;display:inline-flex;align-items:center;gap:4px}
  .views svg{width:15px;height:15px}
  .views button.on{background:var(--purple);color:#fff;border-color:var(--purple)}

  /* Table view */
  table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
  th{background:var(--purple);color:#fff;font-weight:700;text-align:right;padding:10px 12px;font-size:14px;white-space:nowrap}
  td{padding:10px 12px;border-top:1px solid var(--border);vertical-align:middle}
  tr:nth-child(even) td{background:#fbfaff}
  tr:hover td{background:var(--blue-light)}
  .person{display:flex;align-items:center;gap:10px}
  .av{width:38px;height:38px;border-radius:50%;background:var(--purple-light);color:var(--purple);display:flex;align-items:center;justify-content:center;font-weight:800;flex:none;overflow:hidden}
  .av img{width:100%;height:100%;object-fit:cover}
  .nm{font-weight:700}
  .dp{font-size:12px;color:var(--muted)}
  .val{display:inline-flex;align-items:center;gap:6px}
  .val a{color:var(--blue);text-decoration:none}
  .val a:hover{text-decoration:underline}
  .ext{background:var(--blue-light);color:var(--blue);font-weight:800;border-radius:var(--radius);padding:2px 10px}
  .cp{border:0;background:none;cursor:pointer;color:var(--muted);padding:2px;opacity:.6}
  .cp:hover{opacity:1;color:var(--purple)}
  .cp svg{width:15px;height:15px}
  .na{color:#b9aecb}
  mark{background:#fff3b0;color:inherit;padding:0 1px;border-radius:2px}

  /* Card view */
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
  .card{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:14px;border-top:3px solid var(--purple)}
  .card .row{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:14px}
  .card .row svg{width:16px;height:16px;color:var(--muted);flex:none}

  .empty{text-align:center;padding:50px 10px;color:var(--muted);background:#fff;border:1px dashed var(--border);border-radius:var(--radius)}
  .loading{text-align:center;padding:60px 10px;color:var(--muted)}
  .spin{width:36px;height:36px;border:4px solid var(--purple-light);border-top-color:var(--purple);border-radius:50%;animation:s 1s linear infinite;margin:0 auto 12px}
  @keyframes s{to{transform:rotate(360deg)}}
  .pager{display:flex;justify-content:center;gap:6px;margin:16px 0}
  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 18px;border-radius:var(--radius);font-size:14px;opacity:0;transition:.25s;pointer-events:none}
  .toast.show{opacity:1}

  footer{margin-top:30px;background:#fff;border-top:1px solid var(--border)}
  footer .wrap{display:flex;justify-content:space-between;align-items:center;min-height:64px;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
  footer img{height:44px}

  @media (max-width:820px){
    .panel{grid-template-columns:1fr}
    .hide-sm{display:none}
    td,th{padding:8px}
  }
  @media print{ .panel,.views,.pager,.cp,.no-print{display:none!important} body{background:#fff} }
</style>
</head>
<body>

<!-- Official header band: SRU right, ICTD left -->
<div class="band"><div class="wrap">
  <img src="<?!= logos.SRU ?>"  alt="جامعة سليمان الراجحي" onerror="this.style.visibility='hidden'">
  <img src="<?!= logos.ICTD ?>" alt="الإدارة التنفيذية للاتصالات وتقنية المعلومات" onerror="this.style.visibility='hidden'">
</div></div>
<div class="topbar"><div class="wrap">
  <h1><i data-lucide="contact"></i> <?= cfg.APP_NAME_AR ?> <span class="ver">v<?= cfg.VERSION ?></span></h1>
  <div class="sub"><i data-lucide="user-check" style="width:14px;height:14px;vertical-align:-2px"></i>
    <span class="en"><?= userEmail ?></span></div>
</div></div>
<div class="diag"></div>

<main class="wrap">
  <section class="panel">
    <div class="search">
      <i data-lucide="search" class="i"></i>
      <input id="q" type="search" autocomplete="off" autofocus
             placeholder="ابحث بالاسم، البريد، الجوال، التحويلة، الإدارة أو المسمى…">
      <button class="clr" id="clr" title="مسح"><i data-lucide="x"></i></button>
    </div>
    <select id="dept"><option value="">كل الإدارات</option></select>
    <div style="display:flex;gap:6px;flex-wrap:wrap">
      <? if (isAdmin) { ?>
        <button class="btn btn-s" id="exp" title="تصدير النتائج CSV"><i data-lucide="download"></i>تصدير</button>
        <button class="btn btn-p" id="sync" title="جلب منسوبي الجامعة من حسابي في Google (دليل النطاق + جهات الاتصال)"><i data-lucide="cloud-download"></i>مزامنة من حسابي</button>
        <button class="btn btn-s" id="ref" title="إعادة قراءة ورقة الدليل"><i data-lucide="refresh-cw"></i>تحديث</button>
      <? } ?>
      <button class="btn btn-p" onclick="window.print()"><i data-lucide="printer"></i>طباعة</button>
    </div>
  </section>

  <div class="meta">
    <div>عدد النتائج: <b id="cnt">0</b> من <b id="tot">0</b>
      <span id="upd" style="margin-inline-start:12px"></span></div>
    <div class="chips" id="chips"></div>
    <div class="views">
      <button id="vT" class="on" title="جدول"><i data-lucide="table"></i> جدول</button>
      <button id="vC" title="بطاقات"><i data-lucide="layout-grid"></i> بطاقات</button>
    </div>
  </div>

  <div id="out"><div class="loading"><div class="spin"></div>جارٍ تحميل دليل منسوبي الجامعة…</div></div>
  <div class="pager" id="pager"></div>
</main>

<footer><div class="wrap">
  <div>© جامعة سليمان الراجحي · الإدارة التنفيذية للاتصالات وتقنية المعلومات · <?= cfg.APP_NAME_AR ?> — الإصدار <?= cfg.VERSION ?></div>
  <a href="<?= cfg.ITOC_HUB_URL ?>" target="_blank" title="ITOC Forms Hub">
    <img src="<?!= logos.ITOC ?>" alt="ITOC" onerror="this.style.display='none'"></a>
</div></footer>

<div class="toast" id="toast"></div>

<script>
  const icons = () => { try { window.lucide && lucide.createIcons(); } catch (e) {} };
  // Quoted so the script still parses if the page is opened outside Apps Script
  const SHOW_MOBILE = String('<?= cfg.SHOW_MOBILE ?>') !== 'false';
  const PAGE = 50;
  let ALL = [], VIEW = 'table', page = 1, last = [];

  const $ = id => document.getElementById(id);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  /* Arabic-aware normalisation: hamza forms, taa marbuta, alef maqsura, diacritics, Arabic-Indic digits */
  function norm(s){
    return String(s || '').toLowerCase()
      .replace(/[ً-ْـ]/g, '')
      .replace(/[أإآٱ]/g, 'ا').replace(/ة/g, 'ه').replace(/ى/g, 'ي').replace(/ؤ/g, 'و').replace(/ئ/g, 'ي')
      .replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d))
      .replace(/[۰-۹]/g, d => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d));
  }
  const digits = s => norm(s).replace(/\D/g, '');

  /* Explains a problem in Arabic with the fix, instead of an endless spinner */
  function fail(title, body){
    $('out').innerHTML = '<div class="empty" style="text-align:right;line-height:1.9;padding:24px">' +
      '<b style="color:var(--purple);font-size:17px">' + title + '</b><br>' + body + '</div>';
  }

  /* Maps common setup errors to their fix */
  /* Maps common errors to a fix — and ALWAYS shows Google's original message underneath */
  function explain(msg){
    msg = String(msg || '');
    let hint = '';
    if (/has not been used|is disabled|people\.googleapis|People is not defined/i.test(msg))
      hint = 'خدمة <b class="en">People API</b> غير مفعّلة في المشروع: الصق <b class="en">appsscript.json</b> (v2.0) واحفظ ثم أعد النشر — أو من الرابط داخل رسالة الخطأ اضغط <b class="en">Enable</b>.';
    else if (/do not have permission to call|insufficient authentication scopes|insufficient.*scope/i.test(msg)) {
      const m = msg.match(/AUTH_URL:\s*(\S+)/);
      hint = 'الصلاحيات الجديدة لم تُعتمد على حسابك بعد. ' + (m
        ? '<a href="' + esc(m[1]) + '" target="_blank" class="btn btn-p" style="height:34px;margin:6px 0;text-decoration:none">اعتماد الصلاحيات</a> ثم اختر <b class="en">Select all</b> ووافق، وبعدها اضغط «مزامنة من حسابي».'
        : 'افتح رابط التطبيق مع <b class="en">?admin=auth</b> واعتمد جميع الصلاحيات.');
    }
    else if (false)
      hint = 'الصلاحيات الجديدة لم تُعتمد بعد: Deploy ← Manage deployments ← New version ← وافق على صلاحيات Contacts، أو افتح <b class="en">?admin=sync</b>.';
    else if (/setup\(\)/.test(msg))
      hint = 'لم يُنفَّذ الإعداد بعد: افتح رابط التطبيق مع <b class="en">?admin=setup</b>.';
    else if (/caller does not have permission|PERMISSION_DENIED|forbidden|403/i.test(msg))
      hint = 'حسابك لا يملك صلاحية قراءة هذا المصدر (غالباً دليل النطاق مخفي بسياسة Contact sharing). بقية المصادر تعمل إن ظهرت ✅ في تفاصيل الخطأ.';
    return (hint ? hint + '<br>' : '') +
      '<details open style="margin-top:8px"><summary style="cursor:pointer;color:var(--muted)">نص الخطأ من Google</summary>' +
      '<pre class="en" style="white-space:pre-wrap;direction:ltr;text-align:left;background:var(--purple-light);padding:10px;border-radius:4px;font-size:12px;margin:6px 0 0">' +
      esc(msg) + '</pre></details>';
  }

  function load(log, force, sync){
    // Opened outside Apps Script (GitHub Pages / local file) → server bridge does not exist
    if (!(window.google && google.script && google.script.run)) {
      fail('يجب فتح الدليل من رابط تطبيق Google Apps Script',
        'هذه الصفحة تعمل فقط داخل تطبيق الويب المنشور (الرابط الذي ينتهي بـ <b class="en">/exec</b>)، ' +
        'ولا تعمل عند فتحها مباشرة من GitHub أو من الجهاز.<br>' +
        'افتح صفحة الدخول (index.html) واضغط «تسجيل الدخول بحساب الجامعة»، أو افتح رابط <b class="en">/exec</b> مباشرة.');
      return;
    }
    $('out').innerHTML = '<div class="loading"><div class="spin"></div>جارٍ تحميل دليل منسوبي الجامعة…</div>';
    let done = false;
    const timer = setTimeout(() => { if (!done) fail('استغرق التحميل وقتاً أطول من المتوقع',
      'أول تحميل قد يستغرق دقيقة لقراءة الدليل كاملاً. أعد تحميل الصفحة؛ وإن تكرّر ذلك فتأكد من تشغيل <b class="en">setup()</b> مرة واحدة.'); }, 60000);
    const r = google.script.run
      .withSuccessHandler(d => {
        done = true; clearTimeout(timer);
        if (d && d.syncReport) showReport(d.syncReport);
        if (!d || !d.people) return fail('لم تصل بيانات من الخادم', explain('empty response'));
        if (!d.total) return fail('الدليل فارغ — لم تُقرأ أي سجلات',
          'مصدر البيانات: <b class="en">' + esc(d.source || 'workspace') + '</b><br>' +
          'اضغط زر <b>«مزامنة من حسابي»</b> لجلب منسوبي الجامعة من حسابك في Google (دليل النطاق + جهات الاتصال) — دون الحاجة إلى Google Admin.<br>' +
          'يمكن أيضاً إضافة السجلات يدوياً في ورقة <b class="en">Directory</b> بورقة الخلفية ثم الضغط على «تحديث».');
        ALL = d.people.map(p => Object.assign(p, {
          _t: norm([p.name, p.nameAr, p.email, p.department, p.title].join(' ')),
          _d: [p.mobile, p.extension, p.workPhone].map(digits).join(' ')
        }));
        $('tot').textContent = d.total;
        $('upd').innerHTML = '· آخر تحديث: <span class="en">' + esc(d.updatedAt) + '</span>';
        fillDepts(); render();
      })
      .withFailureHandler(e => {
        done = true; clearTimeout(timer);
        fail('تعذّر تحميل البيانات', explain(e && e.message));
      });
    sync ? r.syncFromMyAccount() : force ? r.forceRefresh() : r.getDirectory(!!log);
  }

  function fillDepts(){
    const set = [...new Set(ALL.map(p => p.department).filter(Boolean))].sort((a,b) => a.localeCompare(b,'ar'));
    $('dept').innerHTML = '<option value="">كل الإدارات</option>' + set.map(d => '<option>' + esc(d) + '</option>').join('');
  }

  /* Multi-word AND search across every field; numbers match any phone field (partial, ignoring spaces/+966) */
  function filter(){
    const raw = $('q').value.trim(), dept = $('dept').value;
    // A query made only of digits/spaces/+/-/() is one phone number, not several words
    const terms = /^[\d٠-٩۰-۹\s+\-()]+$/.test(raw) ? [raw.replace(/[\s\-()]/g, '')] : raw.split(/\s+/).filter(Boolean);
    return ALL.filter(p => {
      if (dept && p.department !== dept) return false;
      return terms.every(t => {
        const nt = norm(t), dt = digits(t);
        if (dt && dt.length === nt.replace(/[\s+\-()]/g,'').length) {
          const tail = dt.replace(/^(00966|966|0)/, '');
          return p._d.indexOf(dt) > -1 || (tail.length >= 3 && p._d.indexOf(tail) > -1);
        }
        return p._t.indexOf(nt) > -1;
      });
    });
  }

  function hl(text){
    const terms = $('q').value.trim().split(/\s+/).filter(t => t.length > 1);
    let h = esc(text);
    if (!terms.length || !text) return h;
    terms.forEach(t => {
      const re = new RegExp('(' + t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
      h = h.replace(re, '<mark>$1</mark>');
    });
    return h;
  }

  const initials = n => (String(n).trim().split(/\s+/).slice(0,2).map(w => w[0]).join('') || '؟').toUpperCase();
  const avatar = p => '<div class="av">' + (p.photo ? '<img src="' + esc(p.photo) + '" alt="" referrerpolicy="no-referrer">' : esc(initials(p.name))) + '</div>';
  const copyBtn = v => v ? '<button class="cp" data-c="' + esc(v) + '" title="نسخ"><i data-lucide="copy"></i></button>' : '';
  const telHref = v => 'tel:' + String(v).replace(/[^\d+]/g, '');
  const cell = (v, kind) => {
    if (!v) return '<span class="na">—</span>';
    if (kind === 'mail') return '<span class="val"><a class="en" href="mailto:' + esc(v) + '">' + hl(v) + '</a>' + copyBtn(v) + '</span>';
    if (kind === 'ext')  return '<span class="val"><span class="ext en">' + hl(v) + '</span>' + copyBtn(v) + '</span>';
    return '<span class="val"><a class="en" href="' + telHref(v) + '">' + hl(v) + '</a>' + copyBtn(v) + '</span>';
  };
  const displayName = p => p.nameAr && p.nameAr !== p.name ? p.nameAr + ' <span class="dp en">' + hl(p.name) + '</span>' : hl(p.name);

  function render(){
    last = filter();
    $('cnt').textContent = last.length;
    $('clr').style.display = $('q').value ? 'block' : 'none';
    const pages = Math.max(1, Math.ceil(last.length / PAGE));
    if (page > pages) page = 1;
    const rows = last.slice((page - 1) * PAGE, page * PAGE);

    const chips = [];
    if ($('dept').value) chips.push('الإدارة: ' + esc($('dept').value));
    $('chips').innerHTML = chips.map(c => '<span class="chip">' + c + '</span>').join('');

    if (!rows.length){
      $('out').innerHTML = '<div class="empty"><i data-lucide="search-x"></i><br>لا توجد نتائج مطابقة — جرّب كلمة أخرى أو جزءاً من الرقم.</div>';
    } else if (VIEW === 'table'){
      $('out').innerHTML = '<table><thead><tr><th>#</th><th>الاسم</th><th>البريد الإلكتروني</th>' +
        (SHOW_MOBILE ? '<th>الجوال</th>' : '') + '<th>الهاتف الداخلي</th></tr></thead><tbody>' +
        rows.map((p, i) => '<tr><td class="dp">' + ((page - 1) * PAGE + i + 1) + '</td>' +
          '<td><div class="person">' + avatar(p) + '<div><div class="nm">' + displayName(p) + '</div>' +
          '<div class="dp">' + hl([p.title, p.department].filter(Boolean).join(' · ')) + '</div></div></div></td>' +
          '<td>' + cell(p.email, 'mail') + '</td>' +
          (SHOW_MOBILE ? '<td>' + cell(p.mobile, 'tel') + '</td>' : '') +
          '<td>' + cell(p.extension, 'ext') + '</td></tr>').join('') + '</tbody></table>';
    } else {
      $('out').innerHTML = '<div class="cards">' + rows.map(p =>
        '<div class="card"><div class="person">' + avatar(p) + '<div><div class="nm">' + displayName(p) + '</div>' +
        '<div class="dp">' + hl([p.title, p.department].filter(Boolean).join(' · ')) + '</div></div></div>' +
        '<div class="row"><i data-lucide="mail"></i>' + cell(p.email, 'mail') + '</div>' +
        (SHOW_MOBILE ? '<div class="row"><i data-lucide="smartphone"></i>' + cell(p.mobile, 'tel') + '</div>' : '') +
        '<div class="row"><i data-lucide="phone"></i>' + cell(p.extension, 'ext') + '</div></div>').join('') + '</div>';
    }

    $('pager').innerHTML = pages > 1
      ? '<button class="btn btn-s" ' + (page === 1 ? 'disabled' : '') + ' data-p="' + (page - 1) + '">السابق</button>' +
        '<span style="align-self:center;color:var(--muted)">صفحة ' + page + ' من ' + pages + '</span>' +
        '<button class="btn btn-s" ' + (page === pages ? 'disabled' : '') + ' data-p="' + (page + 1) + '">التالي</button>'
      : '';
    icons();
  }

  function toast(m){ const t = $('toast'); t.textContent = m; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 1600); }

  function exportCsv(){
    const head = ['الاسم','الاسم بالعربي','البريد الإلكتروني','الجوال','الهاتف الداخلي','الإدارة','المسمى'];
    const lines = [head].concat(last.map(p => [p.name, p.nameAr, p.email, SHOW_MOBILE ? p.mobile : '', p.extension, p.department, p.title]))
      .map(r => r.map(v => '"' + String(v || '').replace(/"/g, '""') + '"').join(','));
    const blob = new Blob(['﻿' + lines.join('\r\n')], {type: 'text/csv;charset=utf-8'});
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
    a.download = 'SRU-Contact-Directory-v<?= cfg.VERSION ?>.csv'; a.click();
  }

  let deb;
  $('q').addEventListener('input', () => { clearTimeout(deb); deb = setTimeout(() => { page = 1; render(); }, 150); });
  $('dept').addEventListener('change', () => { page = 1; render(); });
  $('clr').addEventListener('click', () => { $('q').value = ''; page = 1; render(); $('q').focus(); });
  $('vT').addEventListener('click', () => { VIEW = 'table'; $('vT').classList.add('on'); $('vC').classList.remove('on'); render(); });
  $('vC').addEventListener('click', () => { VIEW = 'cards'; $('vC').classList.add('on'); $('vT').classList.remove('on'); render(); });
  document.addEventListener('click', e => {
    const c = e.target.closest('.cp');
    if (c) { navigator.clipboard.writeText(c.dataset.c).then(() => toast('تم النسخ: ' + c.dataset.c)); }
    const p = e.target.closest('[data-p]');
    if (p && !p.disabled) { page = +p.dataset.p; render(); window.scrollTo({top: 0, behavior: 'smooth'}); }
  });
  if ($('exp')) $('exp').addEventListener('click', exportCsv);
  if ($('ref')) $('ref').addEventListener('click', () => load(false, true));
  if ($('sync')) $('sync').addEventListener('click', () => {
    $('out').innerHTML = '<div class="loading"><div class="spin"></div>جارٍ المزامنة من حسابك (دليل النطاق وجهات الاتصال)…</div>';
    load(false, false, true);
  });

  /* Sync result panel shown above the table */
  function showReport(text){
    let box = $('syncRep');
    if (!box) { box = document.createElement('div'); box.id = 'syncRep'; $('out').parentNode.insertBefore(box, $('out')); }
    box.style.cssText = 'background:#fff;border:1px solid var(--border);border-inline-start:4px solid var(--blue);border-radius:4px;padding:10px 14px;margin-bottom:10px;font-size:13px;line-height:1.9;white-space:pre-line';
    box.innerHTML = '<b style="color:var(--purple)">نتيجة المزامنة</b>\n' + esc(text) +
      ' <button class="cp" style="float:left" onclick="this.parentNode.remove()" title="إغلاق">✕</button>';
  }
  document.addEventListener('keydown', e => { if (e.key === '/' && document.activeElement !== $('q')) { e.preventDefault(); $('q').focus(); } });

  icons();
  load(true);
</script>
</body>
</html>
